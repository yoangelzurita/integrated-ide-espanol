<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="#00002b"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.6"/>
  <!-- Microchip Pins -->
  <path d="M120 180 L80 180 M120 256 L80 256 M120 332 L80 332 M392 180 L432 180 M392 256 L432 256 M392 332 L432 332" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <!-- Chip body -->
  <rect x="120" y="130" width="272" height="252" rx="36" fill="#0a192f" stroke="url(#grad)" stroke-width="8" filter="url(#glow)"/>
  <!-- Code brackets symbol < / > -->
  <path d="M210 210 L160 256 L210 302" fill="none" stroke="#00ff66" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M302 210 L352 256 L302 302" fill="none" stroke="#00ff66" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="270" y1="195" x2="242" y2="317" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
  <!-- Microcontroller power dot -->
  <circle cx="150" cy="160" r="10" fill="#38bdf8"/>
</svg>
