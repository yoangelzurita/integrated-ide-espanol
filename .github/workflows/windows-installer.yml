name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the Windows installer release"
        required: true
        default: "v0.1.2"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download Arduino CLI
        run: |
          Invoke-WebRequest https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Windows_64bit.zip -OutFile arduino-cli.zip
          Expand-Archive arduino-cli.zip -DestinationPath arduino-cli
          Copy-Item arduino-cli\arduino-cli.exe arduino-cli.exe

      - name: Package Integrated desktop app
        run: pyinstaller --noconfirm --clean --windowed --name Integrated --paths . --collect-all serial --hidden-import biblioteca --hidden-import vocabulario --hidden-import traductor --hidden-import placas --hidden-import consola --hidden-import ejemplos --hidden-import build_manager --hidden-import config --hidden-import app_paths --add-binary "arduino-cli.exe;." --add-data "biblioteca.py;." --add-data "web;web" main.py

      - name: Verify bundled application library
        run: |
          if (-not (Test-Path "dist\Integrated\_internal\biblioteca.py")) {
            throw "biblioteca.py is missing from the packaged application"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Integrated.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Integrated-Windows-Setup
          path: dist/Integrated-Setup.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Integrated ${{ inputs.version || github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          overwrite_files: true
          files: dist/Integrated-Setup.exe
