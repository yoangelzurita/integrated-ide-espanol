name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the Windows installer release"
        required: true
        default: "v0.1.5"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download Arduino CLI
        run: |
          Invoke-WebRequest https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Windows_64bit.zip -OutFile arduino-cli.zip
          Expand-Archive arduino-cli.zip -DestinationPath arduino-cli
          Copy-Item arduino-cli\arduino-cli.exe arduino-cli.exe

      - name: Download WebView2 Runtime bootstrapper
        run: Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile webview2-setup.exe

      - name: Validate Python source
        run: python -m py_compile web_launcher.py biblioteca.py build_manager.py config.py consola.py ejemplos.py placas.py traductor.py vocabulario.py app_paths.py

      - name: Package Integrated desktop app
        run: pyinstaller --noconfirm --clean --windowed --name Integrated --paths . --collect-all serial --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import webview.platforms.edgechromium --add-binary "arduino-cli.exe;." --add-data "web;web" web_launcher.py

      - name: Verify bundled desktop application
        run: |
          $requiredFiles = @(
            "dist\Integrated\_internal\web\index.html",
            "dist\Integrated\_internal\web\estilos.css",
            "dist\Integrated\_internal\web\app.js",
            "dist\Integrated\_internal\web\icono.svg",
            "dist\Integrated\_internal\arduino-cli.exe",
            "webview2-setup.exe"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required desktop application file is missing: $file"
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Integrated.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Integrated-Windows-Setup
          path: dist/Integrated-Setup.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Integrated ${{ inputs.version || github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          overwrite_files: true
          files: dist/Integrated-Setup.exe
